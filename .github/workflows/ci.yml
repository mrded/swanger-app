name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # A new push to a pull request cancels its older run; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the Xcode used locally (see CONTRIBUTING.md).
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  test:
    name: test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ env.XCODE_APP }}-

      - name: Lint
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests App/Swanger App/SwangerUITests

      - name: Download real-world specs
        run: scripts/fetch-real-world-specs.sh

      - name: Test
        env:
          # RealWorldSpecTests fails rather than skips without the downloaded specs.
          REQUIRE_REAL_WORLD_SPECS: "1"
        run: |
          mkdir -p build/test-results
          swift test --parallel --xunit-output build/test-results/swift-test.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PROJECT: App/Swanger.xcodeproj
      SCHEME: Swanger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('App/Swanger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-${{ env.XCODE_APP }}-

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/results/build-for-testing.xcresult

      - name: UI smoke tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/results/test.xcresult

      - name: Build Release (ad hoc signed)
        run: |
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/results/release.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Zip Swanger.app
        id: zip
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          zip="Swanger-${SHA::7}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Swanger.app "build/$zip"
          echo "path=build/$zip" >> "$GITHUB_OUTPUT"

      - name: Upload Swanger.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Uploaded as-is, so the download is our zip (which keeps the app's permissions and
          # symlinks) rather than a zip wrapped in another zip.
          path: ${{ steps.zip.outputs.path }}
          archive: false
          retention-days: 14

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: build/results
          if-no-files-found: ignore
          retention-days: 14
